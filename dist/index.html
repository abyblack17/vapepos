<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    <title>VapePOS — Sistema POS para Tiendas de Vape</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080d18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#080d18" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="VapePOS" />
    <meta name="msapplication-TileColor" content="#080d18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VapePOS" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Prevent iOS bounce/overscroll and ensure full-screen immersion -->
    <style>
      html, body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        touch-action: manipulation;
        background: #080d18;
      }
      /* Safe area padding for notched phones and home bar */
      #root {
        height: 100%;
        min-height: 100dvh;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
        background: #080d18;
      }
      /* Prevent text selection on tap (native feel) */
      * { -webkit-tap-highlight-color: transparent; }
          @supports (height: 100svh) {
        #root { min-height: 100svh; }
      }
      html.standalone #root,
      html.fullscreen #root {
        padding-top: env(safe-area-inset-top);
      }
    </style>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" href="/icon-192.png" />
    <!-- Inicializar tema ANTES de que React cargue — evita flash blanco -->
    
    <script type="module" crossorigin src="/assets/index-DG1eH35h.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-MPwyhFWN.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Detectar modo instalado / fullscreen para pulir la interfaz tipo app nativa
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.navigator.standalone === true
      if (isStandalone) document.documentElement.classList.add('standalone')
      document.addEventListener('fullscreenchange', () => {
        document.documentElement.classList.toggle('fullscreen', Boolean(document.fullscreenElement))
      })

      // Registrar Service Worker para PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrado:', reg.scope))
            .catch(err => console.warn('SW error:', err))
        })
      }
    </script>
  </body>
</html>
